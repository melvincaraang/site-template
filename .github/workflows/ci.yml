# CI gate chain. Runs on every pull request and on pushes to main, and is
# called by deploy.yml so nothing deploys that did not pass the same checks.
# `ci-status` is the single required status check for branch protection.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: '20'
  PYTHON_VERSION: '3.13'

jobs:
  frontend:
    name: Frontend (lint, types, unit, build, size)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run check
        working-directory: frontend
      - run: npm run test:unit -- --run
        working-directory: frontend
      - name: Build
        working-directory: frontend
        run: npm run build
      - run: npm run check:size
        working-directory: frontend
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frontend-build
          path: frontend/build
          retention-days: 1

  backend:
    name: Backend (ruff, mypy, pytest + coverage, SAM validate)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/tests/requirements.txt
      - name: Install
        working-directory: backend
        run: pip install -r api/requirements.txt -r tests/requirements.txt ruff mypy pytest-cov boto3-stubs types-requests
      - run: ruff check .
        working-directory: backend
      - run: ruff format --check .
        working-directory: backend
      - run: mypy
        working-directory: backend
      - run: python -m pytest --cov --cov-report=term --cov-report=xml
        working-directory: backend
      - name: Lambda bundle imports with production requirements only
        working-directory: backend
        run: |
          python -m venv /tmp/prod-venv
          /tmp/prod-venv/bin/pip install -q -r requirements.txt
          TABLE_NAME=x MEDIA_BUCKET=x PARTY_CODE=x ADMIN_CODE=x JWT_SECRET=x CLOUDFRONT_DOMAIN=x \
            /tmp/prod-venv/bin/python -c "import api.app; print('import ok')"
      - uses: aws-actions/setup-sam@f84ec7d548307efafe33230528756de3c5841a17 # v2
      - run: sam validate --lint --region us-east-1
        working-directory: backend

  e2e:
    name: E2E (Playwright + axe)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/tests/requirements.txt
      - name: Backend venv for the local API server
        working-directory: backend
        run: |
          python -m venv .venv
          .venv/bin/pip install -q -r api/requirements.txt -r tests/requirements.txt
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npx playwright test
        working-directory: frontend
        env:
          CI: 'true'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: playwright-report
          path: |
            frontend/test-results
            frontend/playwright-report
          retention-days: 7

  infra:
    name: Infra (tsc, jest + cdk-nag, synth)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: infra/package-lock.json
      - run: npm ci
        working-directory: infra
      - run: npm run build
        working-directory: infra
      - run: npm test
        working-directory: infra
      - name: Synth (no AWS lookups)
        working-directory: infra
        env:
          CDK_DEFAULT_ACCOUNT: '123456789012'
          SITE_DOMAIN: site.example.com
          PARENT_DOMAIN: example.com
        run: |
          # Seed the hosted-zone lookup so synth needs no credentials.
          cat > cdk.context.json <<'JSON'
          {"hosted-zone:account=123456789012:domainName=example.com:region=us-east-1":{"Id":"/hostedzone/Z123","Name":"example.com."}}
          JSON
          npx cdk synth site-site --no-lookups -c apiGatewayDomain=example.execute-api.us-east-1.amazonaws.com > /dev/null

  security:
    name: Security (gitleaks, semgrep, audits)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # gitleaks-action lists the PR's commits
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Secret scan (blocking)
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - name: SAST — semgrep (advisory)
        continue-on-error: true
        run: |
          uvx --from semgrep semgrep scan --config p/python --config p/typescript --config p/secrets \
            --error --metrics=off --exclude node_modules --exclude .venv --exclude build --exclude cdk.out .
      - name: Dependency audit — pip (advisory)
        continue-on-error: true
        run: uvx pip-audit -r backend/api/requirements.txt --strict
      - name: Dependency audit — npm frontend (advisory)
        continue-on-error: true
        working-directory: frontend
        run: npm audit --audit-level=high
      - name: Dependency audit — npm infra (advisory)
        continue-on-error: true
        working-directory: infra
        run: npm audit --audit-level=high

  workflows:
    name: Workflow lint (actionlint)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: actionlint
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7
          ./actionlint -color

  ci-status:
    name: ci-status
    # The one check branch protection requires. Fails if any gate failed or was cancelled.
    if: always()
    needs: [frontend, backend, e2e, infra, security, workflows]
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          if echo "$RESULTS" | jq -e 'to_entries | map(.value.result) | all(. == "success")' > /dev/null; then
            echo "All gates passed."
          else
            echo "::error::One or more gates did not succeed."
            exit 1
          fi
