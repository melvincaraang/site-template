name: Deploy Tribute Site

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1

jobs:
  # ── Build & Test (runs on every PR and push) ──────────────
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Frontend
      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Lint frontend
        working-directory: ./frontend
        run: npm run lint

      - name: Type-check frontend
        working-directory: ./frontend
        run: npm run check

      - name: Build frontend
        working-directory: ./frontend
        run: npm run build

      - name: Unit test frontend
        working-directory: ./frontend
        run: npm run test:unit -- --run

      # Backend
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install backend dependencies
        working-directory: ./backend
        run: pip install -r api/requirements.txt -r tests/requirements.txt

      - name: Test backend
        working-directory: ./backend
        run: python -m pytest tests/unit -v

      # Infra
      - name: Install CDK dependencies
        working-directory: ./infra
        run: npm ci

      - name: Build CDK
        working-directory: ./infra
        run: npm run build

      # Upload frontend build for deploy job
      - name: Upload frontend build
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: ./frontend/build
          retention-days: 1

  # ── Deploy CDK Infrastructure ─────────────────────────────
  deploy-infra:
    if: github.event_name == 'push'
    needs: ci
    runs-on: ubuntu-latest
    outputs:
      site-bucket: ${{ steps.outputs.outputs.site-bucket }}
      media-bucket: ${{ steps.outputs.outputs.media-bucket }}
      distribution-id: ${{ steps.outputs.outputs.distribution-id }}
      table-name: ${{ steps.outputs.outputs.table-name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install CDK dependencies
        working-directory: ./infra
        run: npm ci

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_IAM_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: CDK deploy
        working-directory: ./infra
        env:
          CDK_DEFAULT_ACCOUNT: ${{ vars.CDK_DEFAULT_ACCOUNT }}
          SITE_DOMAIN: ${{ vars.SITE_DOMAIN }}
          PARENT_DOMAIN: ${{ vars.PARENT_DOMAIN }}
        run: |
          npx cdk deploy TributeSiteStack \
            --require-approval never \
            -c apiGatewayDomain=${{ secrets.API_GATEWAY_DOMAIN }}

      - name: Extract stack outputs
        id: outputs
        run: |
          OUTPUTS=$(aws cloudformation describe-stacks \
            --stack-name TributeSiteStack \
            --query "Stacks[0].Outputs" \
            --output json)

          get_output() {
            echo "$OUTPUTS" | jq -r ".[] | select(.OutputKey==\"$1\") | .OutputValue"
          }

          echo "site-bucket=$(get_output SiteBucketName)" >> "$GITHUB_OUTPUT"
          echo "media-bucket=$(get_output MediaBucketName)" >> "$GITHUB_OUTPUT"
          echo "distribution-id=$(get_output DistributionId)" >> "$GITHUB_OUTPUT"
          echo "table-name=$(get_output TableName)" >> "$GITHUB_OUTPUT"

  # ── Deploy SAM Backend ────────────────────────────────────
  deploy-backend:
    if: github.event_name == 'push'
    needs: deploy-infra
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - uses: aws-actions/setup-sam@v2

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_IAM_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: SAM build
        working-directory: ./backend
        run: sam build --use-container

      - name: SAM deploy
        working-directory: ./backend
        run: |
          sam deploy \
            --stack-name site-backend \
            --resolve-s3 \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --capabilities CAPABILITY_IAM \
            --parameter-overrides \
              TableName=${{ needs.deploy-infra.outputs.table-name }} \
              MediaBucket=${{ needs.deploy-infra.outputs.media-bucket }} \
              PartyCode=${{ secrets.PARTY_CODE }} \
              AdminCode=${{ secrets.ADMIN_CODE }} \
              JwtSecret=${{ secrets.JWT_SECRET }} \
              CloudFrontDomain=${{ vars.SITE_DOMAIN }}

  # ── Deploy Frontend ───────────────────────────────────────
  deploy-frontend:
    if: github.event_name == 'push'
    needs: deploy-infra
    runs-on: ubuntu-latest
    steps:
      - name: Download frontend build
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: ./build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_IAM_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy to S3
        run: aws s3 sync ./build/ s3://${{ needs.deploy-infra.outputs.site-bucket }} --delete

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ needs.deploy-infra.outputs.distribution-id }} \
            --paths "/*"
